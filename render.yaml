services:
  - type: web
    name: minepulse-command
    runtime: static
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: ./dist/public
    autoDeploy: true
    buildFilter:
      paths:
        - client/**
        - supabase/**
        - package.json
        - pnpm-lock.yaml
        - vite.config.ts
        - tsconfig.json
        - render.yaml
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
